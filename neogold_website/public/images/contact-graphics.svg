<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#352961"/>
      <stop offset="100%" stop-color="#774181"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5D485"/>
      <stop offset="50%" stop-color="#E6B325"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="purpleLight" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#352961" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#774181" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  
  <!-- Background Elements -->
  <rect x="0" y="0" width="600" height="600" fill="#ffffff" opacity="0.01"/>
  
  <!-- Concentric circles representing communication -->
  <circle cx="300" cy="300" r="200" stroke="url(#purpleGradient)" stroke-width="2" stroke-dasharray="4 8" fill="none"/>
  <circle cx="300" cy="300" r="160" stroke="url(#purpleGradient)" stroke-width="2" stroke-dasharray="4 8" fill="none"/>
  <circle cx="300" cy="300" r="120" stroke="url(#purpleGradient)" stroke-width="2" stroke-dasharray="4 8" fill="none"/>
  
  <!-- Decorative elements -->
  <circle cx="300" cy="300" r="40" fill="url(#goldGradient)" opacity="0.7"/>
  
  <!-- Email icon stylized -->
  <rect x="240" y="380" width="120" height="80" rx="10" stroke="#D4AF37" stroke-width="2" fill="url(#purpleLight)"/>
  <path d="M240 390 L300 430 L360 390" stroke="#D4AF37" stroke-width="2" fill="none"/>
  
  <!-- Phone icon stylized -->
  <path d="M180 260 C180 240, 160 230, 160 210 C160 190, 180 180, 200 180 C220 180, 240 190, 240 210 C240 230, 220 240, 220 260 Z" stroke="#D4AF37" stroke-width="2" fill="url(#purpleLight)"/>
  
  <!-- Location pin stylized -->
  <path d="M400 240 C400 210, 380 180, 360 180 C340 180, 320 210, 320 240 C320 270, 340 280, 360 300 C380 280, 400 270, 400 240 Z" stroke="#D4AF37" stroke-width="2" fill="url(#purpleLight)"/>
  
  <!-- Connection lines -->
  <path d="M300 340 L300 380" stroke="#D4AF37" stroke-width="2" stroke-dasharray="2 4"/>
  <path d="M260 300 L220 260" stroke="#D4AF37" stroke-width="2" stroke-dasharray="2 4"/>
  <path d="M340 300 L360 300" stroke="#D4AF37" stroke-width="2" stroke-dasharray="2 4"/>
  
  <!-- Small decorative dots -->
  <circle cx="300" cy="340" r="4" fill="#D4AF37"/>
  <circle cx="300" cy="380" r="4" fill="#D4AF37"/>
  <circle cx="260" cy="300" r="4" fill="#D4AF37"/>
  <circle cx="220" cy="260" r="4" fill="#D4AF37"/>
  <circle cx="340" cy="300" r="4" fill="#D4AF37"/>
  <circle cx="360" cy="300" r="4" fill="#D4AF37"/>
</svg> 